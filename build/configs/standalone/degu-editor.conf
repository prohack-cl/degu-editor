# Degú: el editor bajo /editor/, detrás del ALB (`terraform/aws/pool/editor.tf`), en su propio origen
# `editor.<host de la app>` (#5932). Es la forma que documenta ONLYOFFICE para servirlo en una ruta
# virtual: quitar el prefijo y decirle al editor, en X-Forwarded-Host, con qué dirección pública arma
# sus enlaces.
map $http_x_forwarded_proto $degu_esquema {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_upgrade $degu_conexion {
    default upgrade;
    ""      close;
}
# La app que puede mostrar el editor en un marco: la del mismo nombre sin `editor.` (lo crea así
# terraform y la app lo deriva igual, `apps/web/src/lib/editor-origen.ts`). Por cualquier otro nombre
# —el interno del motor, `editor:8080`— solo el propio editor.
map $host $degu_app {
    "~^editor\.(?<app>.+)$" "https://$app";
    default                 "";
}
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 100m;

    location = /editor/healthcheck {
        proxy_pass http://127.0.0.1:80/healthcheck;
    }
    # Las rutas de administración del editor (`/internal`, `/info`, `/admin`, también detrás del
    # prefijo de versión) las protege su nginx SOLO por IP, con `allow 127.0.0.1`, y este proxy le
    # llega desde 127.0.0.1: sin esto, cualquiera desde internet podía apagar el editor con
    # `PUT /editor/internal/cluster/inactive` (`jotramon`, @KatherineGuerrero). El prefijo es
    # cualquier segmento y no solo la forma de una versión: el nginx de Euro-Office acepta
    # `9.3.7|x`, y copiar su forma deja huecos (@KatherineGuerrero). El navegador no pide ninguna
    # ruta con esos segmentos (`web-apps` y `sdkjs` no tienen ninguno). Lo prueba
    # `test_el_editor_cierra_sus_rutas_internas.py`. Es una ubicación por expresión regular: gana
    # sobre `location /editor/`, que es por prefijo.
    location ~* ^/editor/([^/]+/)?(internal|info|admin)(/|$) {
        return 403;
    }
    location /editor/ {
        proxy_pass http://127.0.0.1:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $degu_conexion;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host/editor;
        proxy_set_header X-Forwarded-Proto $degu_esquema;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # La edición a la vez va por un websocket que dura lo que dura la sesión.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # La CSP propia del editor: solo la app de Degú lo muestra en un marco (sin X-Frame-Options,
        # que no sabe nombrar otro origen); `'self'` porque el editor abre sus diálogos y plugins en
        # marcos propios, y frame-ancestors mira toda la cadena. Sin plugins del navegador ni un
        # <base> ajeno, y el navegador no adivina tipos. Lo demás lo da el origen propio: lo que corra
        # acá no ve la sesión de la app.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self' $degu_app; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
